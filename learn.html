<script>
/* Check-off content: blinded calculations, knowledge check, and order-building cases with weighted rubrics.
   PASS CRITERIA ARE PROVISIONAL — local educators must set and validate them (see docs/CLINICAL_REVIEW_NOTES.md). */
(function (root) {
  'use strict';
  const T = root.TPN;
  const ord = (o) => Object.assign(T.emptyOrder(), o || {});
  const between = (v, a, b) => v >= a && v <= b;

  // ---------- A. Calculations (numeric, tolerance-based) ----------
  const CALC = [
    { id: 'c1', prompt: 'TPN D12.5 at 18 mL/hr in a 6.4 kg infant. What is the GIR?', unit: 'mg/kg/min', ans: () => 12.5 * 18 / 6.4 / 6, tol: 0.03 },
    { id: 'c2', prompt: 'A 9.2 kg child: TPN 24 mL/hr, D15, AA 2.5 g/kg/day, lipid 2 g/kg/day. What are the TPN kcal/kg/day?', unit: 'kcal/kg/day',
      ans: () => T.calc({ wt: 9.2, age: 'child' }, ord({ rate: 24, dex: 15, aa: 2.5, il: 2 })).tpnKcalKg, tol: 0.03 },
    { id: 'c3', prompt: 'The bag label reads K 30 mEq/L. Rate 20 mL/hr, weight 7.0 kg. What is the potassium dose?', unit: 'mEq/kg/day', ans: () => 30 * (20 * 24 / 1000) / 7, tol: 0.03 },
    { id: 'c4', prompt: 'You want sodium 4 mEq/kg/day in a 5 kg infant on 12 mL/hr. What concentration should the bag contain?', unit: 'mEq/L', ans: () => 4 * 5 / (12 * 24 / 1000), tol: 0.03 },
    { id: 'c5', prompt: '4.5 kg infant: TPN 14 mL/hr, IVF 2 mL/hr, feeds 8 × 20 mL, lipid 2 g/kg/day (20%). What are the total fluids, including the lipid volume?', unit: 'mL/kg/day',

    { id: 'c6', prompt: 'Orders: KCl 0.8 mEq/kg/day, K-phos 0.6 mmol/kg/day, no K-acetate. What is the total potassium?', unit: 'mEq/kg/day', ans: () => 0.8 + 0.6 * 1.5, tol: 0.03 },
    { id: 'c7', prompt: 'Calcium gluconate 2 mEq/kg/day and phosphate 0.8 mmol/kg/day. What is the Ca:Phos molar ratio (as X : 1)?', unit: ': 1', ans: () => (2 / 2) / 0.8, tol: 0.04 },
    { id: 'c8', prompt: '4.2 kg infant on lipid 1.5 g/kg/day of 20% emulsion. How many mL of lipid per day?', unit: 'mL/day', ans: () => 1.5 * 4.2 * T.IL_ML_PER_G, tol: 0.03 }
  ];

  // ---------- B. Knowledge check (MCQ) ----------
  const MCQ = [
    { id: 'q1', topic: 'Dextrose', q: 'GIR is 10 mg/kg/min and glucose is 240 mg/dL. Best next step?', opts: ['Advance dextrose by 2 mg/kg/min as planned', 'Hold/reduce GIR and look for contributors', 'Increase lipid to add non-glucose calories', 'Add potassium to the next PN bag'], ans: 1, why: 'Hyperglycemia gates dextrose: do not advance; reduce and assess steroids, sepsis, stress (insulin per protocol).' },
    { id: 'q2', topic: 'Lipid', q: 'TG 285 mg/dL on lipid 2 g/kg/day. According to the cheat sheet:', opts: ['Hold advancement', 'Hold lipid completely', 'Double the dose', 'No action'], ans: 0, why: 'TG 200–300 → hold advancement. TG >300 → hold lipid.' },
    { id: 'q3', topic: 'Lipid', q: 'Which statement about L-carnitine in the cheat sheet is correct?', opts: ['It raises TG and should be avoided in PN', '10 mg/kg/day, up to 20, may lower TG', '100 mg/kg/day is the routine dose for all ages', 'It replaces L-cysteine in infant PN'], ans: 1, why: 'L-carnitine 10 mg/kg/day for infants (up to 20) to help lower TG.' },
    { id: 'q4', topic: 'Protein', q: 'BUN 32 on 2 g/kg/day protein. Which is correct?', opts: ['Advance AA by 0.5 g/kg/day as usual', 'Decrease protein by 0.5–1 g/kg/day and monitor', 'Stop dextrose until BUN improves', 'Switch to a lipid-only regimen'], ans: 1, why: 'BUN ≥30 → decrease protein by 0.5–1 g/kg/day.' },
    { id: 'q5', topic: 'Protein', q: 'Which additive is required for infants under 1 year per the sheet?', opts: ['L-carnitine', 'L-cysteine', 'Insulin', 'Heparin'], ans: 1, why: 'If <1 year: must add L-cysteine.' },
    { id: 'q6', topic: 'Calcium/Phos', q: 'What is the Ca:Phos target?', opts: ['Ca 2 : phos 1, comparing mEq to mEq', 'Match ~1:1 after converting Ca to mmol', 'Phosphate about 5 times the calcium', 'There is no target relationship'], ans: 1, why: 'Try to match 1:1 for bone mineralization, converting Ca gluconate mEq to mmol (÷2) before comparing with phos mmol.' },
    { id: 'q7', topic: 'Calcium/Phos', q: 'Patient has a CaCl infusion running. PN phosphate should be:', opts: ['Increased', 'Unchanged', 'Not added', 'Replaced by acetate'], ans: 2, why: 'DO NOT ADD PHOS IF ON CaCl gtt — precipitation risk.' },
    { id: 'q8', topic: 'Calcium/Phos', q: 'Phosphate in the bag must stay below:', opts: ['0.5 mmol/100 mL', '2 mmol/100 mL', '10 mmol/100 mL', '50 mmol/100 mL'], ans: 1, why: 'Keep phos <2 mmol/100 mL; it can precipitate with calcium.' },
    { id: 'q9', topic: 'Electrolytes', q: 'K-phos 0.5 mmol/kg/day contributes how much potassium?', opts: ['About 0.5 mEq per mmol', '0.75 mEq', 'About 1.5 mEq per mmol', 'About 2 mEq per mmol'], ans: 1, why: '1 mmol K-phos = 1.5 mEq K → 0.75 mEq/kg/day.' },
    { id: 'q10', topic: 'Electrolytes', q: 'Na 130 (major hyponatremia correction step) per the sheet:', opts: ['+0.25 mEq/kg/day, a small bump', '½NS → NS or +3–4 mEq/kg/day', '+0.5 mmol/kg/day, a phosphate step', 'Hold sodium and recheck in a week'], ans: 1, why: 'Sodium major adjustment: ½NS → NS, or +3–4 mEq/kg/day; bolus NS 20 mL/kg if indicated.' },
    { id: 'q11', topic: 'Electrolytes', q: 'Oliguric AKI with K 5.4. PN potassium should be:', opts: ['Increased 1 mEq/kg/day', 'Continued unchanged', 'Removed/minimized', 'Switched to acetate'], ans: 2, why: 'Renal dysfunction → be conservative with K, Phos, Mg.' },
    { id: 'q12', topic: 'Acid–base', q: 'Hyperchloremic metabolic acidosis (Cl 112, CO₂ 16) on PN. The best electrolyte shift is:', opts: ['More chloride and less acetate', 'More acetate, less chloride', 'Stop sodium entirely tonight', 'Add phosphate to the next bag'], ans: 1, why: 'Acetate is metabolized to bicarbonate; reduce chloride load.' },
    { id: 'q13', topic: 'Calcium', q: 'Albumin 2.0, total Ca 7.0. The most useful action is to:', opts: ['Give a calcium bolus right away', 'Check ionized calcium', 'Stop all calcium in the PN', 'Increase phosphate to balance it'], ans: 1, why: 'Low albumin lowers total Ca without lowering free Ca; check ionized Ca.' },
    { id: 'q14', topic: 'Fluids', q: 'Fluid-restricted infant, TG 150, glucose 130, GIR 7. To add calories you should:', opts: ['Raise the PN rate 30% to add calories', 'Concentrate dextrose within the GIR goal', 'Stop protein to save volume', 'Add free-water boluses for hydration'], ans: 1, why: 'Concentrate rather than add volume; stay within GIR and access limits.' },
    { id: 'q15', topic: 'Safety', q: 'Peripheral IV with D15 PN is ordered. The issue is:', opts: ['The calories are too low for age', 'Exceeds peripheral dextrose/osmolarity limits', 'The lipid dose is too high', 'The sodium dose is too low'], ans: 1, why: 'Peripheral PN is generally limited to ~12.5% dextrose and ~900 mOsm/L (verify policy).' },
    { id: 'q16', topic: 'Transition', q: 'Enteral feeds provide 80% of goal calories. PN should:', opts: ['Be advanced', 'Be stopped/weaned off', 'Be converted to peripheral', 'Increase lipid'], ans: 1, why: 'At ~75% enteral (protocol dependent) PN is typically stopped.' },
    { id: 'q17', topic: 'Cardiac', q: 'A 3.5 kg infant is on post-bypass day 2, on furosemide, with CO₂ 31 and Cl 94. Which PN change fits best?', opts: ['Favor chloride salts over acetate', 'Add more acetate to the next bag', 'Remove all sodium from the PN', 'Stop protein for 48 hours'], ans: 0, why: 'Loop diuretics waste chloride and cause alkalosis; chloride salts help, acetate adds to it.' },
    { id: 'q18', topic: 'Cardiac', q: 'K is 3.0 in a post-op infant on diuretics. How should replacement be given?', opts: ['A fast IV push over 1 minute', 'As a slow infusion rate over hours, with monitoring', 'Double the PN potassium in tonight\'s bag', 'Give nothing until K falls below 2.5'], ans: 1, why: 'Potassium is never pushed. Replacement runs as an infusion rate; peripheral concentration is also capped (~40 mEq/L).' },
    { id: 'q19', topic: 'Cardiac', q: 'Post-bypass infant, PN day 1. Which lipid start matches the CCU table?', opts: ['3 g/kg/day', '1 g/kg/day', 'None for 2 weeks', '4 g/kg/day'], ans: 1, why: 'The CCU table starts lipid at 1 g/kg and steps toward 3 as TG allows.' },
    { id: 'q20', topic: 'Cardiac', q: 'Feeds reach 120 mL/kg/day in a recovering cardiac infant. What does the CCU guideline suggest for PN?', opts: ['Advance PN lipid', 'Stop PN', 'Double the dextrose', 'Switch to peripheral PN at full strength'], ans: 1, why: 'At about 120 mL/kg enteral, PN is typically stopped (and lipid is cut earlier, near 80 mL/kg).' },
    { id: 'q21', topic: 'Safety', q: 'A peripheral PN bag has K 50 mEq/L. What is the problem?', opts: ['The sodium is too low for age', 'Above the usual ~40 mEq/L peripheral limit', 'The lipid dose is too high', 'Nothing, potassium is always safe peripherally'], ans: 1, why: 'High potassium concentration injures peripheral veins and is unsafe through a small PIV (verify local limit).' },
    { id: 'q22', topic: 'Cardiac', q: 'Which infant most needs a fluid-concentrated PN design?', opts: ['Post-op infant, fluid-restricted, on diuretics', 'A healthy term newborn on full feeds', 'A toddler tolerating full feeds', 'A teenager eating a normal diet'], ans: 0, why: 'Restriction limits volume, so calories and electrolytes are delivered in a smaller volume.' },
    { id: 'q23', topic: 'Lipid', q: 'A cardiac infant has had no lipid for over 2 weeks. What risk is rising?', opts: ['Essential fatty acid deficiency', 'Hypoglycemia as the only concern', 'Vitamin C excess from the PN', 'Hypernatremia from the carrier fluid'], ans: 0, why: 'Without a minimum lipid dose, essential fatty acid deficiency can develop.' },
    { id: 'q24', topic: 'Calcium/Phos', q: 'Calcium is infusing through the same line as PN. What is the key concern?', opts: ['Precipitation with phosphate', 'Too much glucose delivered', 'Low sodium delivery', 'Lipid separation only, nothing else'], ans: 0, why: 'Calcium and phosphate can precipitate; check compatibility and use a dedicated, labeled line.' }
  ];

  // ---------- C. Order-building cases ----------
  const CASES = [
    {
      id: 'k1', title: 'Case 1 — Build the first PN order', patient: { wt: 5.2, age: 'infant' }, fluidGoal: 80, access: 'central', calciumInfusion: false,
      story: '5-month-old, 5.2 kg, POD 0 after AVSD repair. NPO, central line, urine output adequate. The ICU team restricts total fluids to <b>80 mL/kg/day</b>. No calcium infusion. Build the PN order for <b>PN day 1</b>.',
      labs: { na: 138, k: 4.3, cl: 104, co2: 22, bun: 11, cr: 0.4, glu: 110, ca: 9.0, ica: 1.2, phos: 5.4, mg: 2.0, alb: 3.2, tg: 55, dbili: 0.3, alt: 28, uop: 1.5 },
      start: ord({ access: 'central' }), prev: null,
      items: [
        { id: 'gir', label: 'Day-1 GIR 4–8 mg/kg/min', pts: 3, test: (c) => between(c.gir, 4, 8) ? 1 : (between(c.gir, 3, 4) || between(c.gir, 8, 10)) ? 0.5 : 0, why: 'Start conservatively; advance daily toward the 12–14 infant goal.' },
        { id: 'aa', label: 'Amino acids 1.5–3 g/kg/day', pts: 2, test: (c) => between(c.aa, 1.5, 3) ? 1 : 0, why: 'Start protein early; avoid delaying amino acids.' },
        { id: 'il', label: 'Lipid 0.5–1.5 g/kg/day', pts: 2, test: (c) => between(c.il, 0.5, 1.5) ? 1 : between(c.il, 1.5, 2) ? 0.5 : 0, why: 'Start ~1 g/kg/day and advance with TG.' },
        { id: 'cys', label: 'L-cysteine added (infant <1 yr)', pts: 2, test: (c, o) => o.cysteine ? 1 : 0, why: 'Cheat sheet: if <1 year, must add L-cysteine.' },
        { id: 'fluid', label: 'Total fluids ≤80 mL/kg/day (including lipid)', pts: 3, test: (c) => c.totalFluids <= 80 ? 1 : c.totalFluids <= 88 ? 0.5 : 0, why: 'Concentrate, don\'t add volume. Lipid volume counts.' },
        { id: 'kcal', label: 'Total 40–85 kcal/kg/day (partial day-1 provision)', pts: 2, test: (c) => between(c.totalKcalKg, 40, 85) ? 1 : (between(c.totalKcalKg, 30, 40) || between(c.totalKcalKg, 85, 95)) ? 0.5 : 0, why: 'Day 1 is a partial provision building toward goal (85–105).' },
        { id: 'na', label: 'Sodium 2–5 mEq/kg/day', pts: 2, test: (c) => between(c.tot.na, 2, 5) ? 1 : between(c.tot.na, 1, 2) ? 0.5 : 0, why: 'Cheat sheet range for infants.' },
        { id: 'k', label: 'Potassium ≤4 mEq/kg/day', pts: 1, test: (c) => c.tot.k <= 4 ? 1 : 0, why: 'Cheat sheet max 2–4 mEq/kg/day (UOP adequate, K 4.3).' },
        { id: 'ca', label: 'Calcium 0.5–2.5 mEq/kg/day', pts: 1, test: (c) => between(c.tot.ca, 0.5, 2.5) ? 1 : 0, why: 'Neonates/infants need Ca early; sheet range 0.5–4.' },

      ],
      crits: [
        { id: 'gir12', label: 'GIR >12 mg/kg/min on PN day 1', test: (c) => c.gir > 12 },
        { id: 'il3', label: 'Lipid >3 g/kg/day', test: (c) => c.il > 3 },
        { id: 'phos100', label: 'Phosphate ≥2 mmol/100 mL (precipitation)', test: (c) => c.phosPer100 >= 2 },
        { id: 'fluid120', label: 'Total fluids >20% over the restriction', test: (c) => c.totalFluids > 80 * 1.2 },

          { t: 'Triglycerides', ok: true }, { t: 'Liver panel / direct bilirubin (periodic)', ok: true }, { t: 'Daily weight', ok: true },
          { t: 'Ammonia daily', ok: false }, { t: 'Blood culture daily', ok: false }

    {
      id: 'k2', title: 'Case 2 — Advance PN day 3 from labs', patient: { wt: 14, age: 'child' }, fluidGoal: 90, access: 'central', calciumInfusion: false,
      story: '3-year-old, 14 kg, PN day 3. Yesterday\'s order is loaded. Feeds started today (8 × 40 mL of 20 kcal/oz). Fluid goal <b>90 mL/kg/day</b> (including lipid). Review the labs and write today\'s order.',
      labs: { na: 136, k: 3.1, cl: 100, co2: 24, bun: 18, cr: 0.4, glu: 168, ca: 8.9, ica: 1.15, phos: 2.7, mg: 1.5, alb: 3.2, tg: 240, dbili: 0.4, alt: 32, uop: 2.0 },
      prev: ord({ rate: 34, dex: 12.5, aa: 1.5, il: 1.5, cysteine: false, lytes: { naCl: 3, kCl: 1, naPhos: 0.25, ca: 1, mg: 0.3 }, feeds: { n: 0, vol: 0, kcalOz: 0 } }),
      start: ord({ rate: 34, dex: 12.5, aa: 1.5, il: 1.5, cysteine: false, lytes: { naCl: 3, kCl: 1, naPhos: 0.25, ca: 1, mg: 0.3 }, feeds: { n: 8, vol: 40, kcalOz: 20 } }),
      items: [
        { id: 'gir', label: 'GIR advanced ~1–2 mg/kg/min (glucose 168 acceptable)', pts: 3, test: (c, o, p) => { const d = c.gir - p.gir; return between(d, 0.7, 2.3) ? 1 : (between(d, 0.2, 0.7) || between(d, 2.3, 3)) ? 0.5 : 0; }, why: 'Glucose <180 → advance dextrose ~1–2 mg/kg/min.' },

        { id: 'k4', label: 'Potassium above sheet maximum (4 mEq/kg/day)', test: (c) => c.tot.k > 4 },

      ],
      multis: []
    },

    {
      id: 'k3', title: 'Case 3 — Rising TG, high glucose, early cholestasis', patient: { wt: 4.4, age: 'infant' }, fluidGoal: 130, access: 'central', calciumInfusion: false,
      story: '6-month-old, 4.4 kg, <b>PN day 18</b>. TG 410, glucose 236, direct bilirubin 3.1, ALT 96. Yesterday\'s PN is loaded: dextrose 22%, lipid 3 g/kg/day, AA 3 g/kg/day. Minimal trophic feeds. Fluid goal 130 mL/kg/day. Revise the PN order.',
      labs: { na: 137, k: 4.6, cl: 102, co2: 24, bun: 9, cr: 0.3, glu: 236, ca: 9.2, ica: 1.2, phos: 5.4, mg: 2.1, alb: 2.9, tg: 410, dbili: 3.1, alt: 96, uop: 2.6 },

      start: ord({ rate: 18, dex: 22, aa: 3, il: 3, cysteine: true, carnitine: 0, lytes: { naCl: 3, kAc: 2, ca: 2, naPhos: 0.5, kPhos: 0.5, mg: 0.4 }, feeds: { n: 8, vol: 8, kcalOz: 20 } }),

        { id: 'fluid', label: 'Total fluids ≤130 mL/kg/day', pts: 2, test: (c) => c.totalFluids <= 130 ? 1 : 0, why: 'Stay within the goal.' }
      ],

        { id: 'ilKeep', label: 'Lipid >1 g/kg/day with TG 410', test: (c) => c.il > 1 },
        { id: 'girUp', label: 'GIR not reduced despite glucose 236', test: (c, o, p) => c.gir >= p.gir },

          { t: 'Advance enteral feeds as tolerated', ok: true },

          { t: 'Shorten or cycle PN when feasible', ok: true },
          { t: 'Increase lipid to give more calories', ok: false },
          { t: 'Stop amino acids', ok: false }
        ]
      }]

  ];

  const PASS = { calc: 7 / 8, mcq: 0.8, cases: 0.8, noCritical: true };

  /** Score one order against a case rubric. Returns per-item results + critical errors. */
  function scoreCase(cs, order) {
    const c = T.calc(cs.patient, order), p = cs.prev ? T.calc(cs.patient, cs.prev) : null;
    let earned = 0, max = 0;
    const items = cs.items.map(it => {
      const f = it.test(c, order, p), got = f * it.pts; earned += got; max += it.pts;
      return { id: it.id, label: it.label, pts: it.pts, got, f, why: it.why };
    });
    const crits = cs.crits.filter(x => x.test(c, order, p)).map(x => ({ id: x.id, label: x.label }));
    return { earned, max, items, crits, calc: c };
  }
  /** Multi-select scoring: (correct picks − wrong picks) / #correct, floored at 0. */
  function scoreMulti(m, picked) {
    const nOk = m.options.filter(o => o.ok).length;
    let hits = 0, wrong = 0; m.options.forEach((o, i) => { if (picked.includes(i)) { if (o.ok) hits++; else wrong++; } });

    return { calcFrac, mcqFrac, caseFrac, crit, pass };
  }

  /** Shuffle a multiple-choice question's options and remap the answer index (avoids answer-position cueing). */
  function shuffleQ(q) {
    const idx = q.opts.map((_, i) => i);
    for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }

  }
  /** Wrap the first use of each glossary term in an <abbr> tooltip (text nodes only). */
  function abbrify(html, gl) {
    const used = {}; const terms = Object.keys(gl).sort((a, b) => b.length - a.length);
    return html.split(/(<[^>]+>)/).map(part => {
      if (part.charAt(0) === '<') return part;
      terms.forEach(t => {
        if (used[t]) return;
        const re = new RegExp('(^|[^A-Za-z0-9])(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![A-Za-z0-9])');
        if (re.test(part)) { used[t] = 1; part = part.replace(re, (m, a, b) => a + '<abbr title="' + esc(gl[t]) + '">' + b + '</abbr>'); }
      });
      return part;
    }).join('');
  }

  /* ---------------- Labs panel ---------------- */
  function labsHtml(labs, age, prev) {
    return `<div class="labs">${C.LAB_ORDER.map(k => {
      const ref = T.LAB_REF[k], v = labs[k]; if (v == null) return '';
      const fl = T.labFlag(k, v, age); const p = prev && prev[k] != null ? prev[k] : null;
      const d = p != null && p !== v ? (v > p ? `<span class="d">▲ ${f(v - p, 1)}</span>` : `<span class="d">▼ ${f(p - v, 1)}</span>`) : '';
      return `<div class="lab ${fl === 'low' ? 'low' : fl === 'high' ? 'high' : ''}"><div class="k">${ref.label}</div><div class="v">${v} ${d}</div><div class="r">${ref.unit}${fl === 'low' ? ' · low' : fl === 'high' ? ' · high' : ''}</div></div>`;
    }).join('')}</div><div class="small muted" style="margin-top:6px">Reference ranges are approximate flags only — use your laboratory's ranges.${labs.alb != null && labs.ca != null ? ` Albumin-corrected Ca ≈ ${f(T.correctedCa(labs.ca, labs.alb), 1)} mg/dL.` : ''}</div>`;
  }

  /* ---------------- Case runner (Teach + Learn) ---------------- */
  function CaseRunner(rootEl, cs, opts) {
    opts = Object.assign({ mode: 'teach', onDone: null }, opts || {});
    const learn = opts.mode === 'learn';
    const st = { idx: 0, orders: [], labs: [], notes: [], flags: [] };
    rootEl.innerHTML = `
      <div class="card"><h2>${esc(cs.title)}</h2><p class="lede">${esc(cs.history)}</p>
        <div class="small muted">Fluid goal ${cs.fluidGoal} mL/kg/day (teaching assumption) · ${cs.access} access · all patients fictional</div></div>
      <div class="days" role="tablist"></div><div class="dayinfo"></div><div class="ws-host"></div><div class="actions"></div><div class="feedback"></div>`;
    const ws = Workspace($('.ws-host', rootEl), { math: opts.mode === 'teach' || true, flags: true, targets: true, lockPatient: true, lockAccess: true });
    ws.cfg.math = true;

    function days() {
      $('.days', rootEl).innerHTML = cs.days.map((d, i) => {
        const done = !!st.orders[i], locked = learn && i > st.orders.length;
        return `<button type="button" class="${done ? 'done' : ''}" data-day="${i}" ${i === st.idx ? 'aria-current="true"' : ''} ${locked ? 'disabled' : ''}>Day ${d.n}</button>`;
      }).join('');
    }
    function load(i) {
      st.idx = i;
      const prevOrder = i > 0 ? st.orders[i - 1] || null : null;
      const r = C.labsFor(cs, i, prevOrder); st.labs[i] = r.labs; st.notes[i] = r.notes;
      const d = cs.days[i], committed = st.orders[i];
      const start = committed || C.startOrderForDay(cs, i, prevOrder);
      ws.setCase({ pt: cs.patient, o: start, ctx: r.labs, extra: { fluidGoal: cs.fluidGoal, prevOrder } });
      ws.setReadOnly(!!committed);
      days();
      $('.dayinfo', rootEl).innerHTML = `<div class="card"><h3 style="margin-top:0">${esc(d.title)}</h3>
        <div class="story">${esc(d.narrative)}</div>
        ${r.notes.length ? `<div class="callout bad"><b>Overnight consequences of yesterday's order</b><ul>${r.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>` : ''}
        <div class="small muted" style="margin:8px 0 4px">Labs this morning${i > 0 ? ' (▲▼ = change from yesterday)' : ''}</div>${labsHtml(r.labs, cs.patient.age, i > 0 ? st.labs[i - 1] : null)}
        ${d.feeds ? `<div class="small" style="margin-top:8px"><b>Feeds today:</b> ${d.feeds.n} × ${d.feeds.vol} mL of ${d.feeds.kcalOz} kcal/oz (pre-filled)</div>` : '<div class="small" style="margin-top:8px"><b>Feeds today:</b> NPO</div>'}</div>`;
      actions(); $('.feedback', rootEl).innerHTML = committed ? feedbackHtml(i) : '';
    }
    function actions() {
      const i = st.idx, committed = !!st.orders[i], last = i === cs.days.length - 1;
      $('.actions', rootEl).innerHTML = committed
        ? `${!last ? `<button class="primary" data-act="next">Go to Day ${cs.days[i + 1].n} →</button>` : `<button class="primary" data-act="summary">See case summary</button>`}<button data-act="redo" class="ghost">Redo this day (clears later days)</button>`
        : `<button class="primary" data-act="commit">Commit order for Day ${cs.days[i].n}</button>${!learn ? '<button data-act="suggest" class="ghost">Show teaching-default suggestions</button><button data-act="points" class="ghost">Teaching points</button>' : '<span class="small muted">Make your own call first. Suggestions and teaching points unlock after you commit.</span>'}`;
    }
    function feedbackHtml(i) {
      const d = cs.days[i], fl = st.flags[i] || [];
      const crit = fl.filter(x => x.sev === 'crit'), warn = fl.filter(x => x.sev === 'warn');
      return `<div class="card"><h3 style="margin-top:0">Feedback on your Day ${d.n} order</h3>
        ${crit.length ? `<div class="callout bad"><b>${crit.length} critical issue${crit.length > 1 ? 's' : ''}</b>${crit.map(x => `<div>⛔ ${esc(x.text)}<div class="small muted">${esc(x.why)}</div></div>`).join('')}</div>` : '<div class="callout good">No critical safety issues in your order.</div>'}
        ${warn.length ? `<div class="callout"><b>Worth a second look</b>${warn.map(x => `<div>⚠ ${esc(x.text)}<div class="small muted">${esc(x.why)}</div></div>`).join('')}</div>` : ''}
        <details open><summary>Teaching points for this day</summary><ul>${d.teach.map(t => `<li>${esc(t)}</li>`).join('')}</ul><p><b>Debrief:</b> ${esc(d.debrief)}</p></details>
        <details><summary>Teaching-default suggestions for the labs you saw</summary>${sugHtml(st.orders[i], st.labs[i])}</details></div>`;
    }
    function sugHtml(order, labs) {
      const s = T.suggestNext(cs.patient, order, labs);
      return s.length ? s.map(x => `<div class="sug"><div class="a">${esc(x.area)}</div><div>${esc(x.action)}</div><div class="r">${esc(x.reason)} <span class="tag tag-${/sheet/.test(x.rule) ? 's' : /verify|common/.test(x.rule) ? 'c' : 'd'}">${esc(x.rule)}</span></div></div>`).join('') : '<p class="muted">Enter a weight and rate to see suggestions.</p>';
    }
    function summary() {
      const rows = cs.days.map((d, i) => { const c = T.calc(cs.patient, st.orders[i]); const fl = st.flags[i] || [];
        return `<tr><td>Day ${d.n}</td><td class="n">${f(c.gir)}</td><td class="n">${f(c.aa, 2)}</td><td class="n">${f(c.il, 2)}</td><td class="n">${f(c.totalKcalKg, 0)}</td><td class="n">${f(c.totalFluids, 0)}</td><td class="n">${fl.filter(x => x.sev === 'crit').length}</td></tr>`; }).join('');
      const totalCrit = st.flags.reduce((a, fl) => a + (fl || []).filter(x => x.sev === 'crit').length, 0);
      $('.feedback', rootEl).innerHTML = `<div class="card"><h2>Case summary</h2><div class="scroll"><table><tr><th>Day</th><th class="n">GIR</th><th class="n">AA</th><th class="n">Lipid</th><th class="n">kcal/kg</th><th class="n">mL/kg</th><th class="n">Critical</th></tr>${rows}</table></div>
        <p class="${totalCrit ? 'fail' : 'pass'}"><b>${totalCrit ? totalCrit + ' critical flag(s) across the case — review the days above.' : 'No critical safety flags across the case.'}</b></p></div>`;
      if (opts.onDone) opts.onDone({ crit: totalCrit });
    }

    rootEl.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b || !rootEl.contains(b)) return;
      if (b.dataset.day != null) { load(+b.dataset.day); return; }
      const act = b.dataset.act, i = st.idx;
      if (act === 'commit') {
        const s = ws.getState(); if (!(s.pt.wt > 0) || !(num(s.o.rate) > 0)) { $('.feedback', rootEl).innerHTML = '<div class="callout bad">Enter a TPN rate before committing the order.</div>'; return; }
        st.orders[i] = s.o; st.flags[i] = T.evaluate(cs.patient, s.o, st.labs[i], { fluidGoal: cs.fluidGoal, prevOrder: i > 0 ? st.orders[i - 1] : null }).flags;
        // drop stale later days if redoing
        st.orders.length = i + 1; ws.setReadOnly(true); days(); actions(); $('.feedback', rootEl).innerHTML = feedbackHtml(i);
      } else if (act === 'next') { load(i + 1); window.scrollTo({ top: rootEl.offsetTop - 10, behavior: 'smooth' }); }
      else if (act === 'redo') { st.orders.length = i; st.flags.length = i; load(i); }
      else if (act === 'summary') summary();
      else if (act === 'suggest') { const s = ws.getState(); $('.feedback', rootEl).innerHTML = `<div class="card"><h3 style="margin-top:0">Teaching-default suggestions (based on today's labs and your current order)</h3><p class="small muted">Defaults to compare your thinking against — not a protocol. Replace with TCPCHD / Dell Children's guidance.</p>${sugHtml(s.o, st.labs[i])}</div>`; }
      else if (act === 'points') { const d = cs.days[i]; $('.feedback', rootEl).innerHTML = `<div class="card"><h3 style="margin-top:0">Teaching points — Day ${d.n}</h3><ul>${d.teach.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`; }
    });
    load(0);
    return { load, state: st, ws };
  }

  root.TPNUI = { esc, f, $, $$, Workspace, labsHtml, CaseRunner, RANGE_TXT, shuffleQ, abbrify };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Page chrome: header nav + disclaimer footer. */
(function (root) {
  'use strict';
  const PAGES = [['index.html', 'Home', 'home'], ['teach.html', 'Teach', 'teach'], ['learn.html', 'Learn', 'learn'], ['check.html', 'Check-off', 'check']];
  function mount(active) {
    const top = document.createElement('header'); top.className = 'top';
    top.innerHTML = `<div class="in"><span class="paa-slot"></span><!--paa-home--><a class="paa-home" href="https://kayleighatodd-88.github.io/pediatric-app-academy/" aria-label="Pediatric APP Academy home"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 42 L24 6 L40 42" fill="none" stroke="#F4F5F6" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M12.5 30 H19.5 L21.75 24 L25 36 L27.25 30 H35.5" fill="none" stroke="#F2C230" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg><span class="t"><small>The Pediatric</small><b>APP Academy</b></span></a><!--/paa-home--><a class="brand" href="index.html">TPN Lab</a><nav aria-label="Primary">${PAGES.map(p => `<a href="${p[0]}" ${p[2] === active ? 'aria-current="page"' : ''}>${p[1]}</a>`).join('')}</nav></div>`;
    document.body.insertBefore(top, document.body.firstChild);
    const ft = document.createElement('footer'); ft.className = 'disclaimer';
    ft.innerHTML = '<b>Educational simulator — not for patient care.</b> All patients are fictional. Formulas and ranges are drawn from the TCPCHD TPN &amp; TF cheat sheet (6/30/23) where tagged <span class="tag tag-s">sheet</span>; items tagged <span class="tag tag-c">verify</span> are commonly cited and must be checked against your institutional protocol; <span class="tag tag-d">default</span> items are teaching defaults. Always follow your institution\'s PN protocol, pharmacy and attending/RD guidance. Check-off pass criteria are provisional and not validated.';
    document.body.appendChild(ft);
  }
  root.TPNShell = { mount };
})(window);

</script>
<script>
/* Learn mode: modules with guided tasks, quizzes, and practice cases. Progress is stored locally in this browser. */
(function () {
  'use strict';
  const T = TPN, C = TPNC, U = TPNUI, $ = U.$, esc = U.esc;
  TPNShell.mount('learn');
  const KEY = 'tpnlab.learn.v1';
  let prog = {};
  try { prog = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { prog = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) { /* storage unavailable */ } };
  const items = C.MODULES.map(m => ({ id: m.id, title: m.title, min: m.min, mod: m })).concat([{ id: 'prac', title: 'Practice cases (t2–t4)', min: 40, practice: true }, { id: 'gloss', title: 'Glossary', min: 3, glossary: true }]);
  const app = $('#app');
  app.innerHTML = `<div class="learn"><nav class="side card" aria-label="Modules"><b>Modules</b><div class="prog"><i id="pbar"></i></div><ol id="list"></ol><button id="rec" class="small">Download my Learn record</button> <button id="reset" class="ghost small">Reset my progress</button></nav><section id="body"></section></div>`;
  let cur = 0;
  function side() {
    const done = items.filter(i => prog[i.id] && prog[i.id].done).length;
    $('#pbar').style.width = (done / items.length * 100) + '%';
    $('#list').innerHTML = items.map((m, i) => `<li><button data-i="${i}" ${i === cur ? 'aria-current="true"' : ''}><span>${i < C.MODULES.length ? (i + 1) + '. ' : ''}${esc(m.title)}</span><span>${prog[m.id] && prog[m.id].done ? '✓' : m.min + 'm'}</span></button></li>`).join('');
  }
  function mark(id, patch) { prog[id] = Object.assign(prog[id] || {}, patch); save(); side(); }

  function show(i) {
    cur = i; side(); const it = items[i], b = $('#body'); b.innerHTML = '';
    window.scrollTo(0, 0);
    if (it.practice) return practice(b);
    if (it.glossary) return glossary(b);
    const m = it.mod;
    b.innerHTML = `<div class="card"><h1>${esc(m.title)}</h1><div class="small muted">About ${m.min} min</div><h3>Objectives</h3><ul>${m.objectives.map(o => `<li>${esc(o)}</li>`).join('')}</ul></div>
      ${m.simple ? '<div class="callout good small">Simple view: electrolytes are hidden until module 7 so you can focus on the big three first.</div>' : ''}
      <div class="card">${U.abbrify(m.body, C.GLOSSARY)}</div><div id="tasks"></div><div id="case"></div><div id="quiz"></div><div class="actions" id="fin"></div>`;
    m.tasks.forEach((t, k) => task(t, k, m));
    if (m.caseId) U.CaseRunner($('#case', b), C.CASES[m.caseId], { mode: 'learn', onDone: () => mark(m.id, { caseDone: true }) });
    quiz(m);
    const nxt = i + 1 < items.length;
    $('#fin', b).innerHTML = `<button class="primary" id="done">${prog[m.id] && prog[m.id].done ? 'Completed ✓' : 'Mark module complete'}</button>${nxt ? '<button class="ghost" id="nx">Next module →</button>' : ''}`;
    $('#done', b).onclick = () => { mark(m.id, { done: true }); $('#done', b).textContent = 'Completed ✓'; };
    if (nxt) $('#nx', b).onclick = () => show(i + 1);
  }

  function task(t, k, m) {
    const host = document.createElement('div'); host.className = 'card'; $('#tasks').appendChild(host);
    if (t.type === 'numeric') {
      host.innerHTML = `<h3>Try it ${k + 1}</h3><p>${t.prompt}</p><div class="row two"><div><label for="n${m.id}${k}">Your answer <span class="unit">${esc(t.unit || '')}</span></label><input id="n${m.id}${k}" type="number" inputmode="decimal" step="any"></div><div><label>&nbsp;</label><button class="primary">Check</button></div></div><div class="fb"></div>`;
      $('button', host).onclick = () => {
        const v = parseFloat($('input', host).value), a = t.answer(); if (!isFinite(v)) return;
        const ok = Math.abs(v - a) <= Math.abs(a) * (t.tol || 0.03);
        $('.fb', host).innerHTML = `<div class="callout ${ok ? 'good' : 'bad'}"><b>${ok ? 'Correct.' : 'Not quite.'}</b> Answer ≈ ${T.r(a, 2)} ${esc(t.unit || '')}. ${esc(t.explain || '')}</div>`;
        if (ok) mark(m.id, { ['t' + k]: true });
      };
    } else {
      host.innerHTML = `<h3>Try it ${k + 1}</h3><p>${t.prompt}</p><div class="ws-host"></div><div class="actions"><button class="primary">Check my order</button>${t.hint ? '<button class="ghost" data-h>Hint</button>' : ''}</div><div class="fb"></div>`;
      const ws = U.Workspace($('.ws-host', host), { math: true, flags: true, targets: true, lockPatient: true, simple: !!m.simple });
      ws.setCase({ pt: t.patient, o: t.start, ctx: t.ctx || {}, extra: { fluidGoal: t.fluidGoal, prevOrder: t.prev || null } });
      host.querySelector('button.primary').onclick = () => {
        const s = ws.getState(), c = T.calc(t.patient, s.o), res = t.check(c, s.o), ok = res.every(x => x.ok);
        $('.fb', host).innerHTML = `<div class="callout ${ok ? 'good' : 'bad'}"><b>${ok ? 'All criteria met.' : 'Keep going.'}</b><ul class="res">${res.map(x => `<li class="${x.ok ? 'ok' : 'no'}">${esc(x.msg)}</li>`).join('')}</ul></div>`;
        if (ok) mark(m.id, { ['t' + k]: true });
      };
      const h = $('[data-h]', host); if (h) h.onclick = () => { $('.fb', host).innerHTML = `<div class="callout"><b>Hint:</b> ${esc(t.hint)}</div>`; };
    }
  }

  function quiz(m) {
    const host = $('#quiz'); const qs = m.quiz.map(U.shuffleQ);
    host.innerHTML = `<div class="card"><h3 style="margin-top:0">Quick quiz</h3>${qs.map((q, qi) => `<div data-q="${qi}" style="margin-bottom:14px"><p><b>${qi + 1}.</b> ${esc(q.q)}</p>${q.opts.map((o, oi) => `<label class="opt"><input type="radio" name="q${qi}" value="${oi}"><span>${esc(o)}</span></label>`).join('')}<div class="why small"></div></div>`).join('')}<button class="primary" id="qs">Score quiz</button><span id="qr" style="margin-left:10px"></span></div>`;
    $('#qs', host).onclick = () => {
      let got = 0;
      qs.forEach((q, qi) => {
        const box = $(`[data-q="${qi}"]`, host), sel = box.querySelector('input:checked');
        box.querySelectorAll('.opt').forEach((l, oi) => { l.classList.remove('right', 'wrong'); if (oi === q.ans) l.classList.add('right'); else if (sel && +sel.value === oi) l.classList.add('wrong'); });
        if (sel && +sel.value === q.ans) got++;
        $('.why', box).textContent = sel ? q.why : 'Pick an answer — ' + q.why;
      });
      $('#qr').innerHTML = `<b class="${got === qs.length ? 'pass' : ''}">${got}/${qs.length}</b>`;
      mark(m.id, { quiz: got + '/' + qs.length });
    };
  }

  function glossary(b) {
    b.innerHTML = `<div class="card"><h1>Glossary</h1><dl>${Object.keys(C.GLOSSARY).sort().map(k => `<dt><b>${esc(k)}</b></dt><dd>${esc(C.GLOSSARY[k])}</dd>`).join('')}</dl></div>`;
  }

  function record() {
    const lines = ['TPN Lab: Learn completion record', 'Completion is not competence. This record shows activity in this browser only.', 'Generated: ' + new Date().toLocaleString(), ''];
    C.MODULES.forEach((m, i) => { const p = prog[m.id] || {}; const tasks = m.tasks.map((t, k) => p['t' + k] ? 'done' : 'not done').join(', ') || 'none';
      lines.push(`${i + 1}. ${m.title}: ${p.done ? 'marked complete' : 'not complete'}; tasks: ${tasks}; quiz: ${p.quiz || 'not taken'}${m.caseId ? '; case: ' + (p.caseDone ? 'finished' : 'not finished') : ''}`); });
    lines.push('Practice cases: ' + ((prog.prac || {}).done ? 'finished' : 'not finished'));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/plain' })); a.download = 'tpn-lab-learn-record.txt'; document.body.appendChild(a); a.click(); a.remove();
  }

  function practice(b) {
    const ids = ['t2', 't3', 't4'];
    b.innerHTML = `<div class="card"><h1>Practice cases</h1><p class="lede">Apply everything. Each case has hidden tolerances: over-delivering today shows up in tomorrow's labs. Learn mode gives feedback after each day.</p><label for="pc">Case</label><select id="pc">${ids.map(id => `<option value="${id}">${esc(C.CASES[id].title)}</option>`).join('')}</select></div><div id="run"></div>`;
    const go = () => { $('#run', b).innerHTML = ''; U.CaseRunner($('#run', b), C.CASES[$('#pc', b).value], { mode: 'learn', onDone: () => mark('prac', { done: true }) }); };
    $('#pc', b).onchange = go; go();
  }

  $('#list').addEventListener('click', (e) => { const x = e.target.closest('button'); if (x) show(+x.dataset.i); });
  $('#rec').onclick = record;
  $('#reset').onclick = () => { if (confirm('Clear your saved Learn progress in this browser?')) { prog = {}; save(); show(0); } };
  show(0);
})();

</script>
</body></html>
